<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
        #response { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Welcome to My Web App</h2>
        <p>Click the button below to interact with the backend:</p>
        <button onclick="callAppsScript()">Click Me</button>
        <div id="response"></div>
    </div>

    <script>
        // PASTE YOUR APPS SCRIPT WEB APP URL BETWEEN THE QUOTES BELOW
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbypQ0c_t0k4sSveogmR0fPdCpO5yhyr7qsKzAdM9hKvAtexKR1upJZxwtgOwBxMvpjoxw/exec";

        async function callAppsScript() {
            const responseDiv = document.getElementById("response");
            responseDiv.innerText = "Loading...";

            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.text();
                responseDiv.innerText = "Response from Google: " + data;
            } catch (error) {
                responseDiv.innerText = "Error connecting to backend.";
                console.error(error);
            }
        }
    </script>

</body>
</html>
