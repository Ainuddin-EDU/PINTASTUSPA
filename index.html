    const DEFAULT_STUDENTS = [

        id: '1',

        nama: 'Siti Nurhaliza binti Ramli',
        sekolah: 'SK Taman Melawati',
        negeri: 'Selangor',
        markahTeori: 92,
        submitted: true,
        kecergasan: 9,
        bukuAktiviti: 10,
        ikatan: 26,
        pertolonganCemas: 18,
        kawadKaki: 58,
        submittedAt: '2026-07-30T10:15:00.000Z'
      }
    ];

    const INITIAL_ADMINS = {
      ADMIN1: { username: 'ADMIN1', email: '', password: '', registered: false },
      ADMIN2: { username: 'ADMIN2', email: '', password: '', registered: false }
    };

    const calculateScores = (student) => {
      if (!student.submitted) {
        return { peratus: 0, status: 'BELUM HANTAR', isLulus: false, breakdown: { pKecergasan: 0, pBuku: 0, pIkatan: 0, pCemas: 0, pKawad: 0 } };
      }

      const pKecergasan = (Number(student.kecergasan || 0) / 10) * 10;
      const pBuku = (Number(student.bukuAktiviti || 0) / 10) * 10;
      const pIkatan = (Number(student.ikatan || 0) / 30) * 25;
      const pCemas = (Number(student.pertolonganCemas || 0) / 20) * 25;
      const pKawad = (Number(student.kawadKaki || 0) / 65) * 30;

      const totalPeratus = pKecergasan + pBuku + pIkatan + pCemas + pKawad;
      const rounded = Math.round(totalPeratus * 100) / 100;
      const isLulus = rounded >= 60;

      return {
        peratus: rounded,
        status: isLulus ? 'LULUS' : 'GAGAL',
        isLulus,
        breakdown: {
          pKecergasan: Math.round(pKecergasan * 100) / 100,
          pBuku: Math.round(pBuku * 100) / 100,
          pIkatan: Math.round(pIkatan * 100) / 100,
          pCemas: Math.round(pCemas * 100) / 100,
          pKawad: Math.round(pKawad * 100) / 100,
        }
      };
    };

    const formatIC = (icStr) => {
      if (!icStr) return '';
      const clean = icStr.toString().replace(/[^0-9]/g, '');
      if (clean.length === 12) {
        return `${clean.slice(0, 6)}-${clean.slice(6, 8)}-${clean.slice(8, 12)}`;
      }
      return icStr.toString().trim();
    };

    const cleanIC = (icStr) => {
      if (!icStr) return '';
      return icStr.toString().replace(/[^0-9]/g, '');
    };

    const Toast = ({ message, type, onClose }) => {
      if (!message) return null;
      const bg = type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-amber-600' : type === 'info' ? 'bg-blue-600' : 'bg-emerald-600';
      return (
        <div className={`fixed bottom-5 right-5 z-50 flex items-center gap-3 ${bg} text-white px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 transform text-sm font-medium animate-bounce`}>
          {type === 'error' ? <IconXCircle className="w-5 h-5 shrink-0" /> : <IconCheckCircle2 className="w-5 h-5 shrink-0" />}
          <span>{message}</span>
          <button onClick={onClose} className="ml-2 hover:opacity-80 text-white font-bold text-xs bg-white/20 rounded px-1.5 py-0.5">✕</button>
        </div>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('home'); 
      const [adminSubTab, setAdminSubTab] = useState('data'); 

      // Data State dari Supabase Jadual "markah"
      const [students, setStudents] = useState([]);
      const [loadingData, setLoadingData] = useState(true);

      const fetchMarkahFromSupabase = async () => {
        setLoadingData(true);
        try {
          if (!supabaseClient) {
            const saved = localStorage.getItem('sistem_markah_students');
            setStudents(saved ? JSON.parse(saved) : DEFAULT_STUDENTS);
            return;
          }

          const { data, error } = await supabaseClient
            .from('markah')
            .select('*');

          if (error) {
            console.error('Ralat fetching dari Supabase (jadual markah):', error);
            const saved = localStorage.getItem('sistem_markah_students');
            setStudents(saved ? JSON.parse(saved) : DEFAULT_STUDENTS);
          } else if (data && data.length > 0) {
            setStudents(data);
          } else {
            setStudents(DEFAULT_STUDENTS);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setLoadingData(false);
        }
      };

      useEffect(() => {
        fetchMarkahFromSupabase();
      }, []);

      // Admin Accounts State
      const [adminDB, setAdminDB] = useState(() => {
        try {
          const saved = localStorage.getItem('sistem_markah_admin_db');
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              ADMIN1: parsed.ADMIN1 || INITIAL_ADMINS.ADMIN1,
              ADMIN2: parsed.ADMIN2 || INITIAL_ADMINS.ADMIN2
            };
          }
          return INITIAL_ADMINS;
        } catch {
          return INITIAL_ADMINS;
        }
      });

      const [currentAdminUser, setCurrentAdminUser] = useState(() => {
        try {
          return localStorage.getItem('sistem_markah_active_admin') || null;
        } catch {
          return null;
        }
      });

      const isAdminLoggedIn = !!currentAdminUser;

      // Toast State
      const [toast, setToast] = useState({ message: '', type: '' });
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast({ message: '', type: '' }), 4000);
      };

      useEffect(() => {
        try {
          localStorage.setItem('sistem_markah_admin_db', JSON.stringify(adminDB));
        } catch (e) {
          console.error('Failed to save admin DB to localStorage', e);
        }
      }, [adminDB]);

      // Homepage Flow States
      const [icSearchInput, setIcSearchInput] = useState('');
      const [searchResult, setSearchResult] = useState(null); 
      const [step, setStep] = useState(1); 
      
      const [markForm, setMarkForm] = useState({
        kecergasan: '',
        bukuAktiviti: '',
        ikatan: '',
        pertolonganCemas: '',
        kawadKaki: ''
      });

      const [formErrors, setFormErrors] = useState({});
      const [showPreviewModal, setShowPreviewModal] = useState(false);

      // Admin Login & Forgot Password States
      const [selectedAdminId, setSelectedAdminId] = useState('ADMIN1');
      const [loginPassword, setLoginPassword] = useState('');
      const [setupEmail, setSetupEmail] = useState('');
      const [setupPassword, setSetupPassword] = useState('');
      const [setupConfirmPass, setSetupConfirmPass] = useState('');
      const [showForgotModal, setShowForgotModal] = useState(false);
      const [forgotAdminId, setForgotAdminId] = useState('ADMIN1');
      const [simulatedEmailSent, setSimulatedEmailSent] = useState(null);

      const handleSearchIC = (e) => {
        e?.preventDefault();
        const cleanedSearch = cleanIC(icSearchInput);
        if (!cleanedSearch) {
          showToast('Sila masukkan No IC murid', 'warning');
          return;
        }

        const matched = students.find(s => cleanIC(s.noIc) === cleanedSearch);

        if (!matched) {
          setSearchResult({ status: 'NOT_FOUND', student: null });
        } else if (matched.submitted) {
          setSearchResult({ status: 'SUBMITTED', student: matched });
        } else {
          setSearchResult({ status: 'FOUND', student: matched });
        }
      };

      const handleMarkChange = (field, value, maxVal) => {
        if (value !== '' && !/^\d+$/.test(value)) return;

        const numVal = value === '' ? '' : parseInt(value, 10);
        let errorMsg = '';

        if (numVal !== '' && numVal > maxVal) {
          errorMsg = `Markah tidak boleh melebihi ${maxVal}`;
        }

        setMarkForm(prev => ({ ...prev, [field]: value }));
        setFormErrors(prev => ({ ...prev, [field]: errorMsg }));
      };

      const isFormValid = useMemo(() => {
        const fields = [
          { key: 'kecergasan', max: 10 },
          { key: 'bukuAktiviti', max: 10 },
          { key: 'ikatan', max: 30 },
          { key: 'pertolonganCemas', max: 20 },
          { key: 'kawadKaki', max: 65 }
        ];

        for (let f of fields) {
          const val = markForm[f.key];
          if (val === '' || val === null || val === undefined) return false;
          const num = parseInt(val, 10);
          if (isNaN(num) || num < 0 || num > f.max) return false;
        }
        return true;
      }, [markForm]);

      const handleConfirmSubmit = async () => {
        if (!searchResult || !searchResult.student) return;

        const studentId = searchResult.student.id;
        const markahPayload = {
          kecergasan: parseInt(markForm.kecergasan, 10),
          bukuAktiviti: parseInt(markForm.bukuAktiviti, 10),
          ikatan: parseInt(markForm.ikatan, 10),
          pertolonganCemas: parseInt(markForm.pertolonganCemas, 10),
          kawadKaki: parseInt(markForm.kawadKaki, 10),
          submitted: true,
          submittedAt: new Date().toISOString()
        };

        const updatedStudents = students.map(s => {
          if (s.id === studentId) {
            return { ...s, ...markahPayload };
          }
          return s;
        });
        setStudents(updatedStudents);

        if (supabaseClient) {
          const { error } = await supabaseClient
            .from('markah')
            .update(markahPayload)
            .eq('id', studentId);

          if (error) {
            console.error('Gagal kemas kini di jadual markah Supabase:', error);
          }
        }

        setShowPreviewModal(false);
        showToast('Markah murid berjaya disimpan!', 'success');
        
        setStep(1);
        setIcSearchInput('');
        setSearchResult(null);
        setMarkForm({ kecergasan: '', bukuAktiviti: '', ikatan: '', pertolonganCemas: '', kawadKaki: '' });
      };

      const handleFirstTimeSetup = (e) => {
        e.preventDefault();
        if (!setupEmail.trim() || !setupPassword.trim()) {
          showToast('Sila isi e-mel dan kata laluan', 'warning');
          return;
        }
        if (setupPassword !== setupConfirmPass) {
          showToast('Kata laluan dan sahkan kata laluan tidak sepadan', 'error');
          return;
        }

        const targetAdmin = selectedAdminId;
        const updatedDB = {
          ...adminDB,
          [targetAdmin]: {
            username: targetAdmin,
            email: setupEmail.trim(),
            password: setupPassword,
            registered: true
          }
        };

        setAdminDB(updatedDB);
        setCurrentAdminUser(targetAdmin);
        localStorage.setItem('sistem_markah_active_admin', targetAdmin);

        setSetupEmail('');
        setSetupPassword('');
        setSetupConfirmPass('');
        showToast(`Akaun ${targetAdmin} berjaya didaftarkan!`, 'success');
      };

      const handleLoginAdmin = (e) => {
        e.preventDefault();
        const targetAdminObj = adminDB[selectedAdminId];

        if (!targetAdminObj || !targetAdminObj.registered) {
          showToast(`Akaun ${selectedAdminId} belum didaftarkan e-mel.`, 'warning');
          return;
        }

        if (loginPassword === targetAdminObj.password) {
          setCurrentAdminUser(selectedAdminId);
          localStorage.setItem('sistem_markah_active_admin', selectedAdminId);
          setLoginPassword('');
          showToast(`Log masuk berjaya sebagai ${selectedAdminId}!`, 'success');
        } else {
          showToast('Kata laluan salah!', 'error');
        }
      };

      const handleSendForgotPasswordEmail = (e) => {
        e.preventDefault();
        const targetObj = adminDB[forgotAdminId];

        if (!targetObj || !targetObj.registered || !targetObj.email) {
          showToast(`Akaun ${forgotAdminId} belum mendaftarkan e-mel!`, 'error');
          return;
        }

        setSimulatedEmailSent({
          adminId: forgotAdminId,
          email: targetObj.email,
          password: targetObj.password,
          sentTime: new Date().toLocaleTimeString('ms-MY')
        });

        showToast(`Kata laluan telah diemelkan ke ${targetObj.email}`, 'success');
      };

      const handleLogoutAdmin = () => {
        setCurrentAdminUser(null);
        localStorage.removeItem('sistem_markah_active_admin');
        showToast('Anda telah log keluar panel admin', 'info');
      };

      const [searchFilterData, setSearchFilterData] = useState('');
      const [editingStudent, setEditingStudent] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [newStudentForm, setNewStudentForm] = useState({
        noIc: '', nama: '', sekolah: '', negeri: '', markahTeori: 80
      });

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            let parsedRows = [];
            if (window.XLSX) {
              const bstr = evt.target.result;
              const wb = window.XLSX.read(bstr, { type: 'binary' });
              const wsname = wb.SheetNames[0];
              const ws = wb.Sheets[wsname];
              parsedRows = window.XLSX.utils.sheet_to_json(ws);
            }

            if (parsedRows.length === 0) {
              showToast('Tiada rekod dijumpai dalam fail tersebut', 'warning');
              return;
            }

            const newRecords = parsedRows.map((row, idx) => {
              const getVal = (...keys) => {
                for (let k of keys) {
                  const foundKey = Object.keys(row).find(rk => rk.trim().toUpperCase() === k.toUpperCase());
                  if (foundKey && row[foundKey] !== undefined) return row[foundKey];
                }
                return '';
              };

              const rawIc = getVal('NO IC', 'NO_IC', 'NOIC', 'IC', 'KAD PENGENALAN');
              const nama = getVal('NAMA', 'NAMA MURID', 'NAME') || `Murid ${idx + 1}`;
              const sekolah = getVal('SEKOLAH', 'NAMA SEKOLAH', 'SCHOOL') || 'Sekolah Baru';
              const negeri = getVal('NEGERI', 'STATE') || 'Kedah';
              const teori = parseInt(getVal('MARKAH TEORI', 'MARKAH_TEORI', 'TEORI') || '80', 10);

              return {
                id: Date.now().toString() + '_' + idx,
                noIc: formatIC(rawIc) || `080000-00-${1000 + idx}`,
                nama,
                sekolah,
                negeri,
                markahTeori: isNaN(teori) ? 80 : teori,
                submitted: false,
                kecergasan: 0,
                bukuAktiviti: 0,
                ikatan: 0,
                pertolonganCemas: 0,
                kawadKaki: 0,
                submittedAt: null
              };
            });

            setStudents(prev => [...prev, ...newRecords]);

            if (supabaseClient && newRecords.length > 0) {
              const { error } = await supabaseClient.from('markah').insert(newRecords);
              if (error) console.error('Ralat simpan file ke Supabase jadual markah:', error);
            }

            showToast(`Berjaya memuat naik ${newRecords.length} rekod murid!`, 'success');
          } catch (err) {
            console.error(err);
            showToast('Gagal memproses fail Excel.', 'error');
          }
        };

        if (window.XLSX) {
          reader.readAsBinaryString(file);
        } else {
          reader.readAsText(file);
        }
        e.target.value = null;
      };

      const handleDownloadTemplate = () => {
        const templateData = [
          { 'NEGERI': 'Kedah', 'SEKOLAH': 'SK Seri Ampang', 'NAMA': 'Ahmad Faizal bin Bakar', 'NO IC': '080312-02-1234', 'MARKAH TEORI': 85 },
          { 'NEGERI': 'Selangor', 'SEKOLAH': 'SK Cyberjaya', 'NAMA': 'Siti Sarah binti Abdullah', 'NO IC': '080822-10-5678', 'MARKAH TEORI': 90 }
        ];

        if (window.XLSX) {
          const ws = window.XLSX.utils.json_to_sheet(templateData);
          const wb = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(wb, ws, "Data Murid");
          window.XLSX.writeFile(wb, "Template_Data_Murid.xlsx");
        }
        showToast('Template Excel dimuat turun', 'info');
      };

      const handleDeleteStudent = async (id) => {
        setStudents(prev => prev.filter(s => s.id !== id));
        if (supabaseClient) {
          const { error } = await supabaseClient.from('markah').delete().eq('id', id);
          if (error) console.error('Ralat padams Supabase markah:', error);
        }
        showToast('Rekod murid berjaya dipadam', 'success');
      };

      const handleSaveEditStudent = async (e) => {
        e.preventDefault();
        if (!editingStudent) return;

        setStudents(prev => prev.map(s => s.id === editingStudent.id ? editingStudent : s));

        if (supabaseClient) {
          const { error } = await supabaseClient
            .from('markah')
            .update({
              nama: editingStudent.nama,
              noIc: editingStudent.noIc,
              sekolah: editingStudent.sekolah,
              negeri: editingStudent.negeri
            })
            .eq('id', editingStudent.id);
          if (error) console.error('Ralat kemaskini Supabase markah:', error);
        }

        setEditingStudent(null);
        showToast('Maklumat murid telah dikemas kini', 'success');
      };

      const handleAddManualStudent = async (e) => {
        e.preventDefault();
        if (!newStudentForm.nama || !newStudentForm.noIc || !newStudentForm.sekolah || !newStudentForm.negeri) {
          showToast('Sila lengkapkan semua medan', 'warning');
          return;
        }

        const newRec = {
          id: Date.now().toString(),
          noIc: formatIC(newStudentForm.noIc),
          nama: newStudentForm.nama,
          sekolah: newStudentForm.sekolah,
          negeri: newStudentForm.negeri,
          markahTeori: parseInt(newStudentForm.markahTeori || '0', 10),
          submitted: false,
          kecergasan: 0,
          bukuAktiviti: 0,
          ikatan: 0,
          pertolonganCemas: 0,
          kawadKaki: 0,
          submittedAt: null
        };

        setStudents(prev => [newRec, ...prev]);

        if (supabaseClient) {
          const { error } = await supabaseClient.from('markah').insert([newRec]);
          if (error) console.error('Ralat tambah rekod Supabase markah:', error);
        }

        setShowAddModal(false);
        setNewStudentForm({ noIc: '', nama: '', sekolah: '', negeri: '', markahTeori: 80 });
        showToast('Murid baharu berjaya ditambah!', 'success');
      };

      const exportToExcel = () => {
        if (!window.XLSX) {
          showToast('Pustaka Excel belum selesai dimuatkan', 'error');
          return;
        }

        const dataToExport = students.map((s, index) => {
          const calc = calculateScores(s);
          return {
            'Bil': index + 1,
            'Nama Calon': s.nama,
            'No. KP': s.noIc,
            'Sekolah': s.sekolah,
            'Negeri': s.negeri,
            'Kecergasan (10)': s.kecergasan,
            'Buku Aktiviti (10)': s.bukuAktiviti,
            'Ikatan (30)': s.ikatan,
            'Pertolongan Cemas (20)': s.pertolonganCemas,
            'Kawad Kaki (65)': s.kawadKaki,
            'Markah Keseluruhan (%)': calc.peratus,
            'Keputusan': calc.status,
            'Status Penilaian': s.submitted ? 'Selesai' : 'Belum Hantar',
            'Tarikh Penilaian': s.submittedAt ? new Date(s.submittedAt).toLocaleString('ms-MY') : '-'
          };
        });

        const worksheet = XLSX.utils.json_to_sheet(dataToExport);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Keputusan_LKT_2026");
        XLSX.writeFile(workbook, `Laporan_PINTAS_LKT_2026_${new Date().toISOString().substring(0,10)}.xlsx`);
        showToast('Laporan Excel berjaya dimuat turun!');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          <header className="gradient-header text-white shadow-xl sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <APMLogo className="w-12 h-12 md:w-14 md:h-14 drop-shadow-lg" />
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="bg-amber-500 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded uppercase tracking-wider">APM MALAYSIA</span>
                    <span className="text-xs text-amber-200 hidden sm:inline font-semibold">LKT 2026</span>
                  </div>
                  <h1 className="text-xl md:text-2xl font-black tracking-tight leading-tight">PINTAS – LKT 2026</h1>
                  <p className="text-xs text-slate-200 font-medium">Sistem Penilaian Markah Kenaikan Pangkat Lans Koperal TUSPA</p>
                </div>
              </div>

              <div className="flex items-center bg-slate-950/60 p-1.5 rounded-2xl border border-slate-700/60 shadow-inner">
                <button
                  onClick={() => setActiveTab('home')}
                  className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all duration-200 flex items-center space-x-2 ${
                    activeTab === 'home'
                      ? 'bg-amber-500 text-slate-950 shadow-lg'
                      : 'text-slate-300 hover:text-white hover:bg-slate-800/80'
                  }`}
                >
                  <IconSearch className="w-4 h-4" />
                  <span>Borang Penilaian</span>
                </button>
                <button
                  onClick={() => setActiveTab('admin')}
                  className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold transition-all duration-200 flex items-center space-x-2 ${
                    activeTab === 'admin'
                      ? 'bg-amber-500 text-slate-950 shadow-lg'
                      : 'text-slate-300 hover:text-white hover:bg-slate-800/80'
                  }`}
                >
                  <IconShieldCheck className="w-4 h-4" />
                  <span>Panel Admin</span>
                  {isAdminLoggedIn && (
                    <span className="ml-1 w-2 h-2 rounded-full bg-emerald-400"></span>
                  )}
                </button>
              </div>
            </div>
          </header>

          <Toast message={toast.message} type={toast.type} onClose={() => setToast({ message: '', type: '' })} />

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            
            {}
            {activeTab === 'home' && (
              <div className="space-y-6">
                
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                  <div className="flex justify-between items-center mb-2">
                    <h2 className="text-lg font-bold text-slate-900 flex items-center space-x-2">
                      <span className="w-3 h-3 rounded-full bg-amber-500"></span>
                      <span>Carian Murid (No IC)</span>
                    </h2>
                    {step === 2 && (
                      <button
                        onClick={() => setStep(1)}
                        className="text-xs font-bold text-slate-500 hover:text-slate-800 flex items-center space-x-1"
                      >
                        <span>← Kembali ke Carian</span>
                      </button>
                    )}
                  </div>
                  <p className="text-xs text-slate-500 mb-4">Masukkan No IC murid (12 digit) untuk memulakan pengisian markah atau semakan status.</p>

                  <form onSubmit={handleSearchIC} className="flex flex-col sm:flex-row gap-3">
                    <input
                      type="text"
                      placeholder="Contoh: 080101-02-5431 atau 080101025431"
                      value={icSearchInput}
                      onChange={(e) => setIcSearchInput(e.target.value)}
                      className="flex-1 px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:bg-white text-slate-900 font-mono text-sm outline-none transition"
                    />
                    <button
                      type="submit"
                      className="px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm rounded-xl transition shadow flex items-center justify-center space-x-2"
                    >
                      <IconSearch className="w-4 h-4" />
                      <span>Cari Murid</span>
                    </button>
                  </form>
                </div>

                {searchResult && step === 1 && (
                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    {searchResult.status === 'NOT_FOUND' && (
                      <div className="text-center py-6">
                        <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-xl">!</div>
                        <h3 className="text-base font-bold text-slate-900">Rekod Murid Tidak Dijumpai</h3>
                        <p className="text-xs text-slate-500 mt-1">Sila pastikan No IC dimasukkan dengan betul atau hubungi Admin untuk pendaftaran.</p>
                      </div>
                    )}

                    {searchResult.status === 'FOUND' && searchResult.student && (
                      <div className="space-y-4">
                        <div className="flex justify-between items-start flex-wrap gap-2 pb-4 border-b border-slate-100">
                          <div>
                            <span className="px-2.5 py-1 bg-amber-100 text-amber-900 font-extrabold text-[10px] rounded-full uppercase tracking-wider">Status: Belum Hantar</span>
                            <h3 className="text-xl font-black text-slate-900 mt-2">{searchResult.student.nama}</h3>
                            <p className="text-xs font-mono text-slate-500">KP: {searchResult.student.noIc} | {searchResult.student.sekolah}</p>
                          </div>
                          <button
                            onClick={() => {
                              setMarkForm({
                                kecergasan: searchResult.student.kecergasan || '',
                                bukuAktiviti: searchResult.student.bukuAktiviti || '',
                                ikatan: searchResult.student.ikatan || '',
                                pertolonganCemas: searchResult.student.pertolonganCemas || '',
                                kawadKaki: searchResult.student.kawadKaki || ''
                              });
                              setStep(2);
                            }}
                            className="px-6 py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-sm rounded-xl shadow transition flex items-center space-x-2"
                          >
                            <span>Mula Isi Markah</span>
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                          </button>
                        </div>
                      </div>
                    )}

                    {searchResult.status === 'SUBMITTED' && searchResult.student && (
                      <div className="space-y-4">
                        <div className="flex justify-between items-start flex-wrap gap-2 pb-4 border-b border-slate-100">
                          <div>
                            <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 font-extrabold text-[10px] rounded-full uppercase tracking-wider">✓ Status: Selesai Dinilai</span>
                            <h3 className="text-xl font-black text-slate-900 mt-2">{searchResult.student.nama}</h3>
                            <p className="text-xs font-mono text-slate-500">KP: {searchResult.student.noIc} | {searchResult.student.sekolah}</p>
                          </div>
                          <button
                            onClick={() => {
                              setMarkForm({
                                kecergasan: searchResult.student.kecergasan || '',
                                bukuAktiviti: searchResult.student.bukuAktiviti || '',
                                ikatan: searchResult.student.ikatan || '',
                                pertolonganCemas: searchResult.student.pertolonganCemas || '',
                                kawadKaki: searchResult.student.kawadKaki || ''
                              });
                              setStep(2);
                            }}
                            className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs rounded-xl transition"
                          >
                            Kemaskini Markah
                          </button>
                        </div>

                        {(() => {
                          const sc = calculateScores(searchResult.student);
                          return (
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs grid grid-cols-2 sm:grid-cols-3 gap-4">
                              <div>
                                <span className="text-slate-400 block">Keputusan (%)</span>
                                <span className="font-mono font-black text-amber-600 text-base">{sc.peratus}%</span>
                              </div>
                              <div>
                                <span className="text-slate-400 block">Status Keputusan</span>
                                <span className={`font-black text-sm ${sc.isLulus ? 'text-emerald-600' : 'text-red-600'}`}>{sc.status}</span>
                              </div>
                              <div>
                                <span className="text-slate-400 block">Tarikh Hantar</span>
                                <span className="font-mono text-slate-600 text-xs">{searchResult.student.submittedAt ? new Date(searchResult.student.submittedAt).toLocaleString('ms-MY') : '-'}</span>
                              </div>
                            </div>
                          );
                        })()}
                      </div>
                    )}
                  </div>
                )}

                {step === 2 && searchResult && searchResult.student && (
                  <div className="space-y-6 max-w-4xl mx-auto">
                    <div className="space-y-6">
                      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-2 h-full bg-amber-500"></div>
                        <h3 className="text-xl font-black text-slate-900">{searchResult.student.nama}</h3>
                        <p className="text-xs font-mono text-slate-500 mt-0.5">KP: {searchResult.student.noIc} | {searchResult.student.sekolah}</p>
                      </div>

                      <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-5">
                        <h3 className="text-base font-bold text-slate-900 pb-3 border-b border-slate-100">Input Markah Komponen Ujian</h3>

                        {/* 1. Kecergasan */}
                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                          <div className="flex justify-between items-center">
                            <div>
                              <h4 className="font-bold text-sm text-slate-900">1. Ujian Kecergasan</h4>
                              <p className="text-xs text-slate-500">Markah Raw Maksimum: 10 | Pemberat: 10%</p>
                            </div>
                            <span className="text-xs font-mono font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded">10%</span>
                          </div>
                          <div className="flex items-center space-x-3">
                            <input
                              type="number"
                              min="0"
                              max="10"
                              value={markForm.kecergasan}
                              onChange={(e) => handleMarkChange('kecergasan', e.target.value, 10)}
                              placeholder="0-10"
                              className="w-28 px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-900 font-bold text-lg text-center outline-none focus:ring-2 focus:ring-amber-500"
                            />
                            <span className="text-xs text-slate-400 font-medium">/ 10 raw markah</span>
                          </div>
                        </div>

                        {/* 2. Buku Aktiviti */}
                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                          <div className="flex justify-between items-center">
                            <div>
                              <h4 className="font-bold text-sm text-slate-900">2. Buku Aktiviti / Log</h4>
                              <p className="text-xs text-slate-500">Markah Raw Maksimum: 10 | Pemberat: 10%</p>
                            </div>
                            <span className="text-xs font-mono font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded">10%</span>
                          </div>
                          <div className="flex items-center space-x-3">
                            <input
                              type="number"
                              min="0"
                              max="10"
                              value={markForm.bukuAktiviti}
                              onChange={(e) => handleMarkChange('bukuAktiviti', e.target.value, 10)}
                              placeholder="0-10"
                              className="w-28 px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-900 font-bold text-lg text-center outline-none focus:ring-2 focus:ring-amber-500"
                            />
                            <span className="text-xs text-slate-400 font-medium">/ 10 raw markah</span>
                          </div>
                        </div>

                        {/* 3. Ikatan */}
                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                          <div className="flex justify-between items-center">
                            <div>
                              <h4 className="font-bold text-sm text-slate-900">3. Ikatan dan Simpulan</h4>
                              <p className="text-xs text-slate-500">Markah Raw Maksimum: 30 | Pemberat: 25%</p>
                            </div>
                            <span className="text-xs font-mono font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded">25%</span>
                          </div>
                          <div className="flex items-center space-x-3">
                            <input
                              type="number"
                              min="0"
                              max="30"
                              value={markForm.ikatan}
                              onChange={(e) => handleMarkChange('ikatan', e.target.value, 30)}
                              placeholder="0-30"
                              className="w-28 px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-900 font-bold text-lg text-center outline-none focus:ring-2 focus:ring-amber-500"
                            />
                            <span className="text-xs text-slate-400 font-medium">/ 30 raw markah</span>
                          </div>
                        </div>

                        {/* 4. Pertolongan Cemas */}
                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                          <div className="flex justify-between items-center">
                            <div>
                              <h4 className="font-bold text-sm text-slate-900">4. Pertolongan Cemas</h4>
                              <p className="text-xs text-slate-500">Markah Raw Maksimum: 20 | Pemberat: 25%</p>
                            </div>
                            <span className="text-xs font-mono font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded">25%</span>
                          </div>
                          <div className="flex items-center space-x-3">
                            <input
                              type="number"
                              min="0"
                              max="20"
                              value={markForm.pertolonganCemas}
                              onChange={(e) => handleMarkChange('pertolonganCemas', e.target.value, 20)}
                              placeholder="0-20"
                              className="w-28 px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-900 font-bold text-lg text-center outline-none focus:ring-2 focus:ring-amber-500"
                            />
                            <span className="text-xs text-slate-400 font-medium">/ 20 raw markah</span>
                          </div>
                        </div>

                        {/* 5. Kawad Kaki */}
                        <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                          <div className="flex justify-between items-center">
                            <div>
                              <h4 className="font-bold text-sm text-slate-900">5. Kawad Kaki</h4>
                              <p className="text-xs text-slate-500">Markah Raw Maksimum: 65 | Pemberat: 30%</p>
                            </div>
                            <span className="text-xs font-mono font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded">30%</span>
                          </div>
                          <div className="flex items-center space-x-3">
                            <input
                              type="number"
                              min="0"
                              max="65"
                              value={markForm.kawadKaki}
                              onChange={(e) => handleMarkChange('kawadKaki', e.target.value, 65)}
                              placeholder="0-65"
                              className="w-28 px-3 py-2 bg-white border border-slate-300 rounded-lg text-slate-900 font-bold text-lg text-center outline-none focus:ring-2 focus:ring-amber-500"
                            />
                            <span className="text-xs text-slate-400 font-medium">/ 65 raw markah</span>
                          </div>
                        </div>

                        <div className="pt-4 flex items-center justify-end space-x-3 border-t border-slate-100">
                          <button

                    <div className="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-lg">

                      <div>Pertolongan Cemas (20): <strong className="font-mono">{markForm.pertolonganCemas}</strong></div>

                    </button>
                  </div>
                </div>

            )}

            {}

                      </div>

                            selectedAdminId === 'ADMIN1' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 hover:text-slate-900'

                        <button

                            <input
                              type="text"
                              disabled
                              value={selectedAdminId}
                              className="w-full px-4 py-2.5 bg-slate-100 border border-slate-300 rounded-xl font-mono text-xs font-bold text-slate-700"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">Kata Laluan</label>
                            <input
                              type="password"
                              placeholder="Masukkan kata laluan"
                              value={loginPassword}
                              onChange={(e) => setLoginPassword(e.target.value)}

                            />

                            <button

                          <button
                            type="submit"
                            className="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-black text-xs rounded-xl shadow transition"

                            Log Masuk Sebagai {selectedAdminId}
                          </button>
                        </form>
                      ) : (
                        <form onSubmit={handleFirstTimeSetup} className="space-y-4 bg-amber-50/60 p-4 rounded-xl border border-amber-200">

                            <IconKey className="w-4 h-4 text-amber-600 shrink-0" />
                            <span>Pendaftaran Log Masuk Kali Pertama: {selectedAdminId}</span>
                          </div>
                          <p className="text-[11px] text-amber-800 leading-relaxed">
                            Akaun <strong>{selectedAdminId}</strong> dikesan belum didaftarkan. Sila masukkan e-mel rasmi.
                          </p>

                            <label className="block text-xs font-bold text-slate-700 mb-1">Alamat E-mel Rasmi Admin</label>
                            <input
                              type="email"
                              required
                              placeholder="contoh: admin1@apm.gov.my"
                              value={setupEmail}
                              onChange={(e) => setSetupEmail(e.target.value)}
                              className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-500"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">Cipta Kata Laluan</label>
                            <input
                              type="password"
                              required
                              placeholder="Minima 6 aksara"
                              value={setupPassword}
                              onChange={(e) => setSetupPassword(e.target.value)}
                              className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-500"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">Sahkan Kata Laluan</label>
                            <input
                              type="password"
                              required
                              placeholder="Ulang kata laluan"
                              value={setupConfirmPass}
                              onChange={(e) => setSetupConfirmPass(e.target.value)}
                              className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-500"
                            />
                          </div>

                          <button
                            type="submit"
                            className="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black text-xs rounded-xl shadow transition"
                          >
                            Daftar & Log Masuk {selectedAdminId}
                          </button>
                        </form>

                    </div>
                  </div>

                          </p>
                        </div>
                      </div>

                      <div className="flex items-center space-x-3">

                          <IconLogOut className="w-4 h-4" />
                          <span>Log Keluar</span>
                        </button>
                      </div>
                    </div>

                    <div className="flex space-x-2 border-b border-slate-200">

                      <button

                          adminSubTab === 'markah' ? 'border-amber-500 text-amber-600 font-extrabold' : 'border-transparent text-slate-500 hover:text-slate-800'
                        }`}
                      >
                        Rumusan Markah & Keputusan
                      </button>

                          <div className="flex flex-wrap items-center gap-2">
                            <label className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-bold cursor-pointer transition flex items-center space-x-2">

                              <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" />
                            </label>

                            <button
                              onClick={handleDownloadTemplate}
                              className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center space-x-2"
                            >
                              <IconFileSpreadsheet className="w-4 h-4 text-emerald-600" />
                              <span>Muat Turun Template Excel</span>
                            </button>
                          </div>

                          <button
                            onClick={() => setShowAddModal(true)}
                            className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-xl text-xs font-black shadow transition flex items-center space-x-2"
                          >
                            <IconPlus className="w-4 h-4" />
                            <span>Tambah Murid Baru</span>
                          </button>
                        </div>

                        <div className="bg-white p-4 rounded-2xl border border-slate-200 flex items-center space-x-3">
                          <IconSearch className="w-4 h-4 text-slate-400" />
                          <input
                            type="text"
                            placeholder="Cari mengikut Nama, No IC, Sekolah, atau Negeri..."
                            value={searchFilterData}
                            onChange={(e) => setSearchFilterData(e.target.value)}
                            className="w-full text-xs font-medium outline-none bg-transparent"
                          />
                        </div>

                        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                          <div className="overflow-x-auto custom-scrollbar">
                            <table className="w-full text-left text-xs border-collapse">
                              <thead>
                                <tr className="bg-slate-900 text-slate-200 font-extrabold uppercase text-[10px] tracking-wider">
                                  <th className="p-3">Bil</th>
                                  <th className="p-3">Nama</th>
                                  <th className="p-3">No. KP</th>
                                  <th className="p-3">Sekolah</th>
                                  <th className="p-3">Negeri</th>
                                  <th className="p-3">Status</th>
                                  <th className="p-3 text-right">Tindakan</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                {students
                                  .filter(s => 
                                    s.nama?.toLowerCase().includes(searchFilterData.toLowerCase()) ||
                                    s.noIc?.includes(searchFilterData) ||
                                    s.sekolah?.toLowerCase().includes(searchFilterData.toLowerCase()) ||
                                    s.negeri?.toLowerCase().includes(searchFilterData.toLowerCase())
                                  )
                                  .map((st, index) => (
                                    <tr key={st.id} className="hover:bg-slate-50 transition">
                                      <td className="p-3 font-mono text-slate-400">{index + 1}</td>
                                      <td className="p-3 font-bold text-slate-900">{st.nama}</td>
                                      <td className="p-3 font-mono text-slate-600">{st.noIc}</td>
                                      <td className="p-3 text-slate-600">{st.sekolah}</td>
                                      <td className="p-3 text-slate-600">{st.negeri}</td>
                                      <td className="p-3">
                                        {st.submitted ? (
                                          <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-extrabold text-[10px]">SELESAI</span>
                                        ) : (
                                          <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 font-extrabold text-[10px]">BELUM HANTAR</span>
                                        )}

                                      <td className="p-3 text-right space-x-2">
                                        <button
                                          onClick={() => setEditingStudent(st)}
                                          className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition"
                                          title="Edit"

                                          <IconEdit className="w-3.5 h-3.5" />
                                        </button>
                                        <button
                                          onClick={() => handleDeleteStudent(st.id)}
                                          className="p-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition"
                                          title="Padam"
                                        >
                                          <IconTrash2 className="w-3.5 h-3.5" />
                                        </button>
                                      </td>
                                    </tr>
                                  ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    )}

                    {}
                    {adminSubTab === 'markah' && (
                      <div className="space-y-6">
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <span className="text-xs font-bold text-slate-400 uppercase">Jumlah Calon</span>
                            <p className="text-2xl font-black text-slate-900 font-mono mt-1">{students.length}</p>
                          </div>
                          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <span className="text-xs font-bold text-slate-400 uppercase">Selesai Dinilai</span>
                            <p className="text-2xl font-black text-emerald-600 font-mono mt-1">{students.filter(s => s.submitted).length}</p>
                          </div>
                          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <span className="text-xs font-bold text-slate-400 uppercase">Peratus Kelulusan</span>
                            <p className="text-2xl font-black text-amber-500 font-mono mt-1">
                              {students.filter(s => s.submitted).length > 0
                                ? Math.round((students.filter(s => s.submitted && calculateScores(s).isLulus).length / students.filter(s => s.submitted).length) * 100)
                                : 0}%
                            </p>
                          </div>
                        </div>

                        <div className="flex justify-end">
                          <button
                            onClick={exportToExcel}
                            className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs rounded-xl shadow transition flex items-center space-x-2"
                          >
                            <IconDownload className="w-4 h-4" />
                            <span>Eksport Keputusan Ke Excel</span>
                          </button>
                        </div>

                        <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                          <div className="overflow-x-auto custom-scrollbar">
                            <table className="w-full text-left text-xs border-collapse">
                              <thead>
                                <tr className="bg-slate-900 text-slate-200 font-extrabold uppercase text-[10px] tracking-wider">
                                  <th className="p-3">Nama</th>
                                  <th className="p-3">Kecergasan (10)</th>
                                  <th className="p-3">Buku (10)</th>
                                  <th className="p-3">Ikatan (30)</th>
                                  <th className="p-3">Cemas (20)</th>
                                  <th className="p-3">Kawad (65)</th>
                                  <th className="p-3">Jumlah (%)</th>
                                  <th className="p-3">Keputusan</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100 font-mono">
                                {students.map((st) => {
                                  const sc = calculateScores(st);
                                  return (
                                    <tr key={st.id} className="hover:bg-slate-50 transition">
                                      <td className="p-3 font-sans font-bold text-slate-900">{st.nama}</td>
                                      <td className="p-3">{st.kecergasan}</td>
                                      <td className="p-3">{st.bukuAktiviti}</td>
                                      <td className="p-3">{st.ikatan}</td>
                                      <td className="p-3">{st.pertolonganCemas}</td>
                                      <td className="p-3">{st.kawadKaki}</td>
                                      <td className="p-3 font-bold text-amber-600">{sc.peratus}%</td>
                                      <td className="p-3 font-sans">
                                        {st.submitted ? (
                                          <span className={`px-2 py-0.5 rounded-full text-[10px] font-extrabold ${sc.isLulus ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                            {sc.status}
                                          </span>
                                        ) : (
                                          <span className="text-slate-400">-</span>
                                        )}
                                      </td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>

                      </div>
                    )}

                  </div>
                )}
              </div>
            )}

          </main>

          {/* Modal Edit Murid */}
          {editingStudent && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-lg font-black text-slate-900">Kemaskini Maklumat Murid</h3>
                <form onSubmit={handleSaveEditStudent} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Nama</label>
                    <input
                      type="text"
                      value={editingStudent.nama}
                      onChange={(e) => setEditingStudent({ ...editingStudent, nama: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">No IC</label>
                    <input
                      type="text"
                      value={editingStudent.noIc}
                      onChange={(e) => setEditingStudent({ ...editingStudent, noIc: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Sekolah</label>
                    <input
                      type="text"
                      value={editingStudent.sekolah}
                      onChange={(e) => setEditingStudent({ ...editingStudent, sekolah: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Negeri</label>
                    <input
                      type="text"
                      value={editingStudent.negeri}
                      onChange={(e) => setEditingStudent({ ...editingStudent, negeri: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs"
                    />
                  </div>

                  <div className="flex justify-end space-x-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setEditingStudent(null)}
                      className="px-4 py-2 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-amber-500 text-slate-950 font-black text-xs rounded-xl shadow"
                    >
                      Simpan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Tambah Murid */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-lg font-black text-slate-900">Tambah Rekod Murid Baharu</h3>
                <form onSubmit={handleAddManualStudent} className="space-y-3">

                    <label className="block text-xs font-bold text-slate-700 mb-1">Nama Penuh</label>

                      type="text"
                      required
                      placeholder="Contoh: Muhammad Ali bin Ahmad"

                      onChange={(e) => setNewStudentForm({ ...newStudentForm, nama: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">No. Kad Pengenalan (12 Digit)</label>
                    <input
                      type="text"
                      required
                      placeholder="Contoh: 080101025431"
                      value={newStudentForm.noIc}
                      onChange={(e) => setNewStudentForm({ ...newStudentForm, noIc: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-mono"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Sekolah</label>
                    <input
                      type="text"
                      required
                      placeholder="Contoh: SK Seri Perdana"
                      value={newStudentForm.sekolah}
                      onChange={(e) => setNewStudentForm({ ...newStudentForm, sekolah: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Negeri</label>
                    <input
                      type="text"
                      required
                      placeholder="Contoh: Kedah"
                      value={newStudentForm.negeri}
                      onChange={(e) => setNewStudentForm({ ...newStudentForm, negeri: e.target.value })}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs"
                    />
                  </div>

                  <div className="flex justify-end space-x-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-amber-500 text-slate-950 font-black text-xs rounded-xl shadow"
                    >
                      Tambah Murid
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Terlupa Kata Laluan */}
          {showForgotModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                  <h3 className="text-base font-black text-slate-900 flex items-center space-x-2">
                    <IconMail className="w-5 h-5 text-amber-500" />
                    <span>Terlupa Kata Laluan Admin</span>
                  </h3>
                  <button onClick={() => setShowForgotModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <p className="text-xs text-slate-500 leading-relaxed">
                  Pilih ID Admin anda. Kata laluan akan dihantar melalui e-mel yang telah didaftarkan.
                </p>

                <form onSubmit={handleSendForgotPasswordEmail} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Pilih ID Admin</label>
                    <select
                      value={forgotAdminId}
                      onChange={(e) => setForgotAdminId(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-bold bg-slate-50"
                    >
                      <option value="ADMIN1">ADMIN1</option>
                      <option value="ADMIN2">ADMIN2</option>
                    </select>
                  </div>

                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
                    <span className="text-slate-400 block mb-0.5">E-mel Berdaftar:</span>
                    <span className="font-mono font-bold text-slate-800">
                      {adminDB[forgotAdminId]?.registered ? adminDB[forgotAdminId]?.email : '(Belum didaftarkan)'}
                    </span>
                  </div>

                  {simulatedEmailSent && (
                    <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl space-y-1 text-xs">
                      <div className="flex items-center space-x-1.5 text-emerald-800 font-bold">
                        <IconCheckCircle2 className="w-4 h-4 text-emerald-600" />
                        <span>E-Mel Berjaya Dihantar!</span>
                      </div>
                      <p className="text-[11px] text-emerald-700">
                        Kata laluan bagi <strong>{simulatedEmailSent.adminId}</strong> ialah: <strong className="font-mono text-emerald-950 bg-emerald-200/60 px-1 rounded">{simulatedEmailSent.password}</strong>
                      </p>
                    </div>
                  )}

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowForgotModal(false)}
                      className="px-4 py-2 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl"
                    >
                      Tutup
                    </button>
                    <button
                      type="submit"
                      disabled={!adminDB[forgotAdminId]?.registered}
                      className={`px-4 py-2 text-xs font-black rounded-xl shadow transition ${
                        adminDB[forgotAdminId]?.registered
                          ? 'bg-amber-500 hover:bg-amber-600 text-slate-950'
                          : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                      }`}
                    >
                      Hantar E-mel Kata Laluan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
